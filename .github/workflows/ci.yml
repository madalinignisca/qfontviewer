name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-ubuntu:
    name: build & test (Ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ qt6-base-dev qt6-base-dev-tools \
            qt6-tools-dev qt6-l10n-tools \
            fonts-dejavu-core fonts-liberation
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  build-test-arch:
    name: build & test (Arch)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install git (needed by checkout)
        # Refresh the keyring first in case the base image is stale (rotated
        # package signing keys would otherwise fail signature checks).
        run: pacman -Sy --noconfirm archlinux-keyring && pacman -S --noconfirm git
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pacman -S --noconfirm qt6-base qt6-tools cmake ninja gcc ttf-dejavu
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  pre-commit:
    name: pre-commit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install pre-commit
        run: pip install pre-commit
      # Runs clang-format (pinned 22.1.5 via the mirror) plus the hygiene hooks,
      # reproducibly across machines.
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install reuse
        run: pip install reuse==6.2.0
      - name: reuse lint
        run: reuse lint

  metadata:
    name: AppStream & desktop validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install validators
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends appstream desktop-file-utils
      - name: Validate metainfo
        run: appstreamcli validate data/io.github.madalinignisca.qfontviewer.metainfo.xml
      - name: Validate desktop entry
        run: desktop-file-validate io.github.madalinignisca.qfontviewer.desktop

  analyze:
    name: static analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang clazy cppcheck \
            qt6-base-dev qt6-base-dev-tools qt6-tools-dev qt6-l10n-tools
      # Pin clang-tidy via the PyPI wheel so its version (and thus its checks) is
      # identical to local dev — distro clang-tidy versions differ and drift. The
      # wheel bundles its own clang, so it isn't tied to the apt clang version.
      - name: Install clang-tidy (pinned)
        run: pip install clang-tidy==22.1.0
      # Configure with clang so compile_commands.json carries clang-compatible
      # flags (Qt6 adds the GCC-only -mno-direct-extern-access under g++, which
      # clang-tidy/clazy cannot parse).
      - name: Configure (clang, generates compile_commands.json)
        run: >
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=OFF
          -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_COMPILER=clang
      # clang-tidy and clazy are blocking (the tree is clean; regressions fail CI).
      - name: clang-tidy
        run: clang-tidy -p build --warnings-as-errors='*' src/*.cpp
      - name: clazy
        run: |
          out=$(clazy-standalone -p build src/*.cpp 2>&1)
          echo "$out"
          if echo "$out" | grep -q 'warning:'; then
            echo "::error::clazy reported warnings"; exit 1
          fi
      # cppcheck remains advisory (can't be reproduced locally on the dev box).
      - name: cppcheck (advisory)
        continue-on-error: true
        run: >
          cppcheck --enable=warning,performance,portability --std=c++17
          --project=build/compile_commands.json --suppress=missingIncludeSystem
