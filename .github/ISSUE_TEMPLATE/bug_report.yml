name: Bug report
description: Report a problem with qfontviewer
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a bug!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: qfontviewer version
      placeholder: "1.1.0 (or git commit)"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Distro, Qt version, X11/Wayland compositor
      placeholder: "Arch, Qt 6.11, Sway/Wayland"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console output / logs
      render: shell
